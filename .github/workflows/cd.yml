name: PlantGuard CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plantguard-image-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish commit-addressed container images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in backend frontend; do
            dockerfile=Dockerfile
            if [ "$service" = frontend ]; then dockerfile=frontend/Dockerfile; fi
            image="${namespace}-${service}:sha-${GITHUB_SHA}"
            docker build -f "$dockerfile" --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$image" .
            docker push "$image"
            docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
