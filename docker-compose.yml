services:
  backend:
    image: ${PLANTGUARD_BACKEND_IMAGE:-plantguard-backend:local}
    build: .
    environment:
      MODEL_PATH: /app/models/plantguard_model.pt
      MODEL_META_PATH: /app/models/model_metadata.json
      VISION_MODEL_ROOT: /app/vision-models
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.6}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      MAX_BATCH_FILES: ${MAX_BATCH_FILES:-8}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.15}
      DRIFT_MIN_SAMPLES: ${DRIFT_MIN_SAMPLES:-20}
      DRIFT_WINDOW: ${DRIFT_WINDOW:-200}
    volumes:
      - type: bind
        source: ${PLANTGUARD_MODELS_DIR:-./models}
        target: /app/models
        read_only: true
      - type: bind
        source: ${PLANTGUARD_VISION_MODELS_DIR:-./vision-models}
        target: /app/vision-models
        read_only: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m

  frontend:
    image: ${PLANTGUARD_FRONTEND_IMAGE:-plantguard-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${PLANTGUARD_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

  mlflow:
    profiles: [tracking]
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --allowed-hosts localhost:5000,127.0.0.1:5000,localhost,127.0.0.1
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlruns/artifacts --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/mlruns

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prometheus_data:
