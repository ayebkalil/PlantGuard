name: PlantGuard CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PYTHONHASHSEED: "42"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.10"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci --prefix frontend
      - name: Check syntax and run tests with coverage
        run: |
          uv run --locked python -m compileall -q backend ml
          uv run --locked python -m pytest --cov=backend.app --cov=ml --cov-report=term-missing --cov-report=xml
      - name: Build React application
        run: npm run build --prefix frontend
      - name: Verify DVC graph and Docker models
        run: |
          uv run --locked dvc dag
          docker compose config --quiet
          docker compose build
      - name: Verify container health and frontend proxy
        run: |
          docker compose up -d --no-build
          curl --retry 20 --retry-all-errors --retry-delay 2 --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/ | grep -q PlantGuard
          curl --fail http://localhost:3000/api/metrics/prometheus | grep -q plantguard_model_ready
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          for attempt in {1..20}; do
            if curl -fsSG http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="plantguard"} == 1' | grep -q '"job":"plantguard"'; then
              exit 0
            fi
            sleep 2
          done
          echo "Prometheus did not scrape the backend successfully."
          exit 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-coverage
          path: coverage.xml
      - name: Compose logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
