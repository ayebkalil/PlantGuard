dataset:
  root: data/raw/plantvillage
  image_size: 128
  split_seed: 42
  val_fraction: 0.20
  test_fraction: 0.20

training:
  seed: 42
  batch_size: 16
  learning_rate: 0.001
  epochs: 8
  models: [simple_cnn, mobilenet_v3_small]
  pretrained: true
  num_workers: 0
  experiment_name: plantguard-plantvillage-benchmark

registry:
  min_validation_macro_f1: 0.50
  max_cpu_p95_ms: 500
