[project]
name = "plantguard"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.138,<1",
    "numpy>=2.2,<3",
    "pillow>=12.2,<13",
    "prometheus-client>=0.22,<1",
    "python-multipart>=0.0.27,<1",
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "dvc>=3.67,<4",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "mlflow>=3.16,<4",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pyyaml>=6.0.2,<7",
    "scikit-learn>=1.7,<2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
