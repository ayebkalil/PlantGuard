stages:
  prepare_data:
    cmd: python -m ml.pipeline prepare
    deps:
      - ${dataset.root}
      - ml/data/dataset_registry.py
      - ml/preprocessing/preprocess.py
      - ml/pipeline.py
      - uv.lock
    params:
      - dataset
    outs:
      - data/processed
  train:
    cmd: python -m ml.pipeline train
    deps:
      - data/processed
      - ${dataset.root}
      - ml/model.py
      - ml/training/train.py
      - ml/preprocessing/preprocess.py
      - ml/registry.py
      - ml/pipeline.py
      - uv.lock
    params:
      - dataset
      - training
      - registry
    outs:
      - models:
          persist: true
  evaluate:
    cmd: python -m ml.pipeline evaluate
    deps:
      - models/model_metadata.json
      - models/registry
      - data/processed
      - ${dataset.root}
      - ml/model.py
      - ml/evaluation/evaluate.py
      - ml/training/train.py
      - ml/pipeline.py
      - uv.lock
    params:
      - dataset
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/evaluation.json:
          cache: false
